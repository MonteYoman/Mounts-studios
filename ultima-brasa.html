<script>

 for(const s of sh){s.x+=s.vx*dt;s.y+=s.vy*dt;s.l-=dt;for(const e of en){if(s.h<=0)break;if(s.hit.has(e))continue;if(Math.hypot(e.x-s.x,e.y-s.y)<e.r+4){const cr=R()<.12,dm=p.dmg*(cr?2:1);e.hp-=dm;e.fh=.08;s.hit.add(e);s.h--;num(e.x,e.y-e.r,dm,cr);burst(s.x,s.y,cr?7:3,'#ffd27a',140,.3);if(e.k>=2)shk=Math.max(shk,1.5)}}}
 sh=sh.filter(s=>s.l>0&&s.h>0);

 for(const f of fx)f.l-=dt;fx=fx.filter(f=>f.l>0);

 if(R()<dt*40&&pt.length<500)pt.push({x:p.x+(R()-.5)*W,y:p.y+(R()-.5)*H,vx:(R()-.5)*14,vy:-18-R()*22,l:3,L:3,c:'#ff8a4c',r:1+R()*1.5,amb:1});

 }

 x.restore();
 const lr=Math.min(W,H)*.55*(1+Math.min(.5,(lvl-1)*.03))*L;
 g=x.createRadialGradient(W/2,H/2,lr*.35,W/2,H/2,Math.max(W,H)*.75);g.addColorStop(0,'rgba(8,3,4,0)');g.addColorStop(.55,'rgba(8,3,4,.35)');g.addColorStop(1,'rgba(8,3,4,.78)');x.fillStyle=g;x.fillRect(0,0,W,H);
 if(p.hp/p.max<.35){g=x.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.7);g.addColorStop(0,'rgba(255,30,20,0)');g.addColorStop(1,'rgba(255,30,20,'+(.25+.15*Math.sin(tt*8))+')');x.fillStyle=g;x.fillRect(0,0,W,H)}
 if(fl>0){x.fillStyle='rgba(255,179,71,'+fl*.35+')';x.fillRect(0,0,W,H)}
 if(warn>0){x.globalAlpha=Math.min(1,warn);x.fillStyle='#ff5a1f';x.font='600 '+Math.min(64,W/9)+'px Teko,system-ui,sans-serif';x.textAlign='center';x.fillText('¡Llega un jefe!',W/2,H*.28);x.globalAlpha=1}
 if(jo){x.strokeStyle='rgba(255,255,255,.25)';x.lineWidth=2;x.beginPath();x.arc(jo.x,jo.y,55,0,7);x.stroke();x.fillStyle='rgba(255,255,255,.3)';x.beginPath();x.arc(jc.x,jc.y,20,0,7);x.fill()}
 $('hp').firstChild.style.width=Math.max(0,p.hp/p.max*100)+'%';
 $('xp').firstChild.style.width=(xp/need*100)+'%';
 $('tm').textContent=T(t);$('inf').textContent='Nivel '+lvl+' · '+kills+' bajas';
}
function loop(ts){const dt=Math.min(.05,(ts-lt)/1000||0);lt=ts;tt+=dt;if(st=='play')upd(dt);else if(st=='menu'||st=='over')idle(dt);draw();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{const k=e.key.length==1?e.key.toLowerCase():e.key;keys[k]=1;if(k.startsWith('Arrow'))e.preventDefault();if(k=='p'||k=='Escape')pauseG()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&st=='play')pauseG()});
addEventListener('keyup',e=>{keys[e.key.length==1?e.key.toLowerCase():e.key]=0});
c.addEventListener('pointerdown',e=>{if(st!='play')return;jo={x:e.clientX,y:e.clientY};jc={x:e.clientX,y:e.clientY};c.setPointerCapture(e.pointerId)});
c.addEventListener('pointermove',e=>{if(!jo)return;jc={x:e.clientX,y:e.clientY};const dx=jc.x-jo.x,dy=jc.y-jo.y,l=Math.hypot(dx,dy),k=Math.min(1,l/55);
 if(l<8){jx=jy=0}else{jx=dx/l*k;jy=dy/l*k}if(l>55){jc={x:jo.x+dx/l*55,y:jo.y+dy/l*55}}});
const up=()=>{jo=null;jx=jy=0};
c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
$('mu').textContent=mute?'🔇':'🔊';
init();menu();requestAnimationFrame(loop);
